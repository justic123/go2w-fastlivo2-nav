planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 0.5
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.1
      use_astar: true
      allow_unknown: false
controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    odom_topic: /mppi/odom
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: progress_checker
    goal_checker_plugins:
    - goal_checker
    controller_plugins:
    - FollowPath
    failure_tolerance: 0.3
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.05
      movement_time_allowance: 20.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.08
      yaw_goal_tolerance: 0.12
      stateful: false
    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      time_steps: 40
      model_dt: 0.05
      batch_size: 1000
      iteration_count: 1
      vx_std: 0.12
      vy_std: 0.0
      wz_std: 0.3
      vx_max: 0.2
      vx_min: -0.1
      vy_max: 0.0
      wz_max: 0.8
      motion_model: DiffDrive
      prune_distance: 1.7
      transform_tolerance: 0.6
      temperature: 0.3
      gamma: 0.015
      visualize: false
      regenerate_noises: false
      critics:
      - ConstraintCritic
      - CostCritic
      - GoalCritic
      - GoalAngleCritic
      - PathAlignCritic
      - PathFollowCritic
      - PathAngleCritic
      - PreferForwardCritic
      - VelocityDeadbandCritic
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        consider_footprint: true
        collision_cost: 1000000.0
        critical_cost: 300.0
        near_goal_distance: 0.5
        trajectory_point_step: 2
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 7.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.12
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 6.0
        threshold_to_consider: 0.5
        offset_from_furthest: 10
        trajectory_point_step: 4
        use_path_orientations: false
        max_path_occupancy_ratio: 0.05
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
        offset_from_furthest: 5
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        threshold_to_consider: 0.12
        offset_from_furthest: 4
        max_angle_to_furthest: 1.0
        mode: 0
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      VelocityDeadbandCritic:
        enabled: true
        cost_power: 1
        cost_weight: 35.0
        deadband_velocities:
        - 0.08
        - 0.0
        - 0.0
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: go2w_mppi_base
      use_sim_time: true
      rolling_window: false
      width: 60
      height: 60
      resolution: 0.1
      footprint: '[[0.375,0.22],[0.375,-0.22],[-0.375,-0.22],[-0.375,0.22]]'
      footprint_padding: 0.05
      transform_tolerance: 0.6
      track_unknown_space: true
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      always_send_full_costmap: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: lidar
        max_obstacle_height: 1.2
        lidar:
          topic: /mppi/cloud
          data_type: PointCloud2
          clearing: true
          marking: true
          min_obstacle_height: -0.2
          max_obstacle_height: 1.2
          expected_update_rate: 0.8
          observation_persistence: 0.0
          obstacle_max_range: 8.0
          raytrace_max_range: 9.0
          obstacle_min_range: 0.0
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.8
        cost_scaling_factor: 3.0
      origin_x: -30.0
      origin_y: -30.0
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /map
        map_subscribe_transient_local: true
        subscribe_to_updates: false
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 2.0
      global_frame: camera_init
      robot_base_frame: go2w_mppi_base
      use_sim_time: true
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      footprint: '[[0.375,0.22],[0.375,-0.22],[-0.375,-0.22],[-0.375,0.22]]'
      footprint_padding: 0.05
      transform_tolerance: 0.6
      track_unknown_space: true
      plugins:
      - obstacle_layer
      - inflation_layer
      always_send_full_costmap: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: lidar
        max_obstacle_height: 1.2
        lidar:
          topic: /mppi/cloud
          data_type: PointCloud2
          clearing: true
          marking: true
          min_obstacle_height: -0.2
          max_obstacle_height: 1.2
          expected_update_rate: 0.8
          observation_persistence: 0.0
          obstacle_max_range: 8.0
          raytrace_max_range: 9.0
          obstacle_min_range: 0.0
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.8
        cost_scaling_factor: 3.0
lifecycle_manager:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names:
    - map_server
    - planner_server
    - controller_server
    - velocity_smoother
    - bt_navigator
velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    feedback: OPEN_LOOP
    scale_velocities: false
    max_velocity:
    - 0.2
    - 0.0
    - 0.8
    min_velocity:
    - -0.1
    - 0.0
    - -0.8
    max_accel:
    - 0.2
    - 0.0
    - 0.5
    max_decel:
    - -0.3
    - 0.0
    - -0.5
    odom_topic: /mppi/odom
    odom_duration: 0.1
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    velocity_timeout: 0.3
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: go2w_mppi_base
    odom_topic: /mppi/odom
    transform_tolerance: 0.6
    default_nav_to_pose_bt_xml: /work/navigate.xml
    default_nav_through_poses_bt_xml: /work/navigate_through.xml
    bt_loop_duration: 10
    default_server_timeout: 20
    plugin_lib_names:
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_rate_controller_bt_node
    - nav2_pipeline_sequence_bt_node
map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: /work/maps/room-20260928/map.yaml
    topic_name: /map
    frame_id: map
