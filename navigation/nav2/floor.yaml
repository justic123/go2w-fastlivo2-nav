planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 0.5
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.1
      use_astar: true
      allow_unknown: false
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    odom_topic: /go2w_nav/odom
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: progress_checker
    goal_checker_plugin: goal_checker
    controller_plugins:
    - FollowPath
    - ApproachPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.1
      movement_time_allowance: 60.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.08
      yaw_goal_tolerance: 0.15
      stateful: true
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      debug_trajectory_details: true
      min_vel_x: 0.0
      max_vel_x: 0.2
      min_vel_y: 0.0
      max_vel_y: 0.0
      max_vel_theta: 0.8
      min_speed_xy: 0.08
      max_speed_xy: 0.2
      min_speed_theta: 0.08
      acc_lim_x: 0.2
      acc_lim_y: 0.0
      acc_lim_theta: 0.2
      decel_lim_x: -0.2
      decel_lim_y: 0.0
      decel_lim_theta: -0.2
      vx_samples: 8
      vy_samples: 1
      vtheta_samples: 12
      sim_time: 2.0
      linear_granularity: 0.025
      angular_granularity: 0.025
      transform_tolerance: 0.85
      xy_goal_tolerance: 0.08
      trans_stopped_velocity: 0.02
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics:
      - RotateToGoal
      - BaseObstacle
      - ObstacleFootprint
      - PathAlign
      - PathDist
      - GoalDist
      BaseObstacle.scale: 0.1
      ObstacleFootprint.scale: 1.0
      PathAlign.scale: 16.0
      PathAlign.forward_point_distance: 0.2
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
    ApproachPath:
      plugin: dwb_core::DWBLocalPlanner
      debug_trajectory_details: true
      min_vel_x: 0.0
      max_vel_x: 0.08
      min_vel_y: 0.0
      max_vel_y: 0.0
      max_vel_theta: 0.25
      min_speed_xy: 0.04
      max_speed_xy: 0.08
      min_speed_theta: 0.08
      acc_lim_x: 0.2
      acc_lim_y: 0.0
      acc_lim_theta: 0.2
      decel_lim_x: -0.2
      decel_lim_y: 0.0
      decel_lim_theta: -0.2
      vx_samples: 8
      vy_samples: 1
      vtheta_samples: 12
      sim_time: 1.0
      linear_granularity: 0.025
      angular_granularity: 0.025
      transform_tolerance: 0.85
      xy_goal_tolerance: 0.08
      trans_stopped_velocity: 0.02
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics:
      - RotateToGoal
      - BaseObstacle
      - ObstacleFootprint
      - PathAlign
      - PathDist
      - GoalDist
      BaseObstacle.scale: 0.1
      ObstacleFootprint.scale: 1.0
      PathAlign.scale: 16.0
      PathAlign.forward_point_distance: 0.2
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 0.5
      global_frame: camera_init
      robot_base_frame: go2w_base
      use_sim_time: false
      rolling_window: false
      width: 200
      height: 200
      resolution: 0.1
      footprint: '[[0.375,0.22],[0.375,-0.22],[-0.375,-0.22],[-0.375,0.22]]'
      footprint_padding: 0.05
      transform_tolerance: 0.85
      track_unknown_space: true
      plugins:
      - obstacle_layer
      - inflation_layer
      always_send_full_costmap: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: lidar
        max_obstacle_height: 1.2
        lidar:
          topic: /go2w_nav/cloud
          data_type: PointCloud2
          clearing: true
          marking: true
          min_obstacle_height: -0.2
          max_obstacle_height: 1.2
          obstacle_range: 8.0
          raytrace_range: 9.0
          expected_update_rate: 0.8
          observation_persistence: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.8
        cost_scaling_factor: 3.0
      origin_x: -100.0
      origin_y: -100.0
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 1.0
      global_frame: camera_init
      robot_base_frame: go2w_base
      use_sim_time: false
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      footprint: '[[0.375,0.22],[0.375,-0.22],[-0.375,-0.22],[-0.375,0.22]]'
      footprint_padding: 0.05
      transform_tolerance: 0.85
      track_unknown_space: true
      plugins:
      - obstacle_layer
      - inflation_layer
      always_send_full_costmap: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: lidar
        max_obstacle_height: 1.2
        lidar:
          topic: /go2w_nav/cloud
          data_type: PointCloud2
          clearing: true
          marking: true
          min_obstacle_height: -0.2
          max_obstacle_height: 1.2
          obstacle_range: 8.0
          raytrace_range: 9.0
          expected_update_rate: 0.8
          observation_persistence: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.8
        cost_scaling_factor: 3.0
lifecycle_manager:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
    - planner_server
    - controller_server
